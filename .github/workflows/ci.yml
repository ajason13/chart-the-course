name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify production artifacts and app and experiment checks
        run: npm run check

      - name: Reconcile production artifacts with compliance evidence
        run: npm run compliance

      - name: Audit tooling and experiment dependencies separately
        run: npm run audit:all

      - name: Preserve production compliance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-compliance
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .compliance/
            dist/.vite/runtime-dependencies.json
            dist/.vite/manifest.json

      - name: Preserve browser failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures
          if-no-files-found: ignore
          path: test-results/
